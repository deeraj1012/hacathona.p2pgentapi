services:
  - type: web
    name: p2p-hackathon-mcp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py --transport streamable-http --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
    healthCheckPath: /mcp-health
